# Dependabot will run on day 3 of each month at 02:52 (Europe/Berlin timezone)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "52 2 3 * *"
    open-pull-requests-limit: 15
  - package-ecosystem: "npm"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "52 2 3 * *"
    open-pull-requests-limit: 20
    versioning-strategy: "increase"
    directories: "**/*"
